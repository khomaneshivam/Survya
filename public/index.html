<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SARVYA Connect</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      padding: 2.5rem;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.75rem; color: #0284c7; }
    p { font-size: 0.95rem; color: #64748b; line-height: 1.5; margin-bottom: 1.5rem; }
    code { background: #f1f5f9; padding: 0.25rem 0.5rem; border-radius: 0.375rem; font-size: 0.875rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>SARVYA Connect</h1>
    <p>Modern React frontend build is compiling or pending build. To serve the full dashboard, build the client application:</p>
    <code>npm --prefix frontend run build</code>
  </div>
</body>
</html>
