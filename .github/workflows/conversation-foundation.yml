name: Conversation Foundation Quality Gate

on:
  push:
    branches:
      - "review/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: conversation-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conversation-regressions:
    name: Conversation isolation and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check modified backend modules
        run: |
          node --check src/services/webhookService.js
          node --check src/services/queue/jobWorkerEngine.js
          node --check server.js
          node --check src/controllers/webhookController.js
          node --check src/config/schema.js
          node --check src/routes/apiRoutes.js
          node --check src/services/conversationFlowEngine.js
          node --check src/services/conversationFlowService.js
          node --check src/services/workflow/nodeExecutors/index.js
          node --check src/services/workflow/conversationContextResolver.js
      - name: Isolated regression tests (no database required)
        run: |
          node --test tests/conversation_tenant_workflows.test.js tests/inbox_tenant_isolation.test.js tests/durable_webhook_ingress.test.js tests/schema_driven_workflow_input.test.js

  frontend-quality:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
