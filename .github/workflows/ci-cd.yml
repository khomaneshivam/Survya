name: SARVYA CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deployment Target Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================================================
  # 1. FRONTEND: Lint & Production Vite Asset Build
  # ============================================================================
  frontend-build:
    name: Frontend Build & Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          npm --prefix frontend ci

      - name: Frontend Static Analysis & Lint (Oxlint)
        run: npm --prefix frontend run lint

      - name: Compile Vite Production Bundle
        run: |
          npm --prefix frontend run build

      - name: Verify Build Artifacts
        run: |
          test -f frontend/dist/index.html || { echo "Missing frontend/dist/index.html"; exit 1; }
          test -d frontend/dist/assets || { echo "Missing frontend/dist/assets directory"; exit 1; }
          echo "Frontend build successfully verified. Dist size:"
          du -sh frontend/dist

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ============================================================================
  # 2. BACKEND: Database Migration, Fresh Deployment & Master Production QA
  # ============================================================================
  backend-test:
    name: Backend QA & MySQL Database Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: whatsapp_bulk_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=6

    env:
      NODE_ENV: test
      DB_CLIENT: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: whatsapp_bulk_test
      JWT_SECRET: ci_test_secret_at_least_32_characters_long_for_security_12345
      APP_TIMEZONE: Asia/Kolkata
      DATA_DIR: ./data
      UPLOADS_DIR: ./uploads
      # CI is offline-only. These deliberately invalid values ensure no test can
      # accidentally reach a real Meta Graph API endpoint.
      META_API_URL: http://127.0.0.1:9
      META_API_TOKEN: ci-simulation-only
      WHATSAPP_ACCESS_TOKEN: ci-simulation-only

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Backend Dependencies
        run: |
          npm ci

      - name: Prepare Required Directories
        run: |
          mkdir -p data uploads public/uploads/inbound

      - name: Verify Schema Initialization & Migrations (94 Tables)
        run: |
          npm run db:init

      - name: Test Clean Cold-Start Deployment on Empty Database
        run: |
          node scripts/test_fresh_deployment.js

      - name: Run Master Production QA & Layer 1-10 Regression Suites
        run: |
          node tests/master_production_qa.test.js
          node tests/layer1_security_foundation.test.js
          node tests/layer2_communication_reliability.test.js
          node tests/layer3_workflow_engine.test.js
          node tests/layer4_template_studio.test.js
          node tests/layer5_commerce_concurrency.test.js
          node tests/layer6_ai_guardrails.test.js
          node tests/layer7_campaigns_analytics.test.js
          node tests/layer9_saas_sre.test.js
          node tests/layer10_e2e_journeys.test.js

      - name: Run Core Multi-Domain Platform Regression Tests
        run: |
          node tests/security_and_reliability.test.js
          node tests/frontend_design_system.test.js
          node tests/universal_autoreply_platform.test.js
          node tests/universal_masters_and_nodes.test.js
          node tests/universal_catalog_availability_pricing.test.js
          node tests/universal_fulfillment_and_payments.test.js
          node tests/hybrid_inapp_bridge_and_analytics.test.js

# End of CI configuration.

